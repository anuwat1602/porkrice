<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System (KDS) - KhaMoo Empire</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .order-card-new {
            animation: pulseAlert 1.5s infinite alternate;
        }

        @keyframes pulseAlert {
            0% { border-color: rgba(220, 38, 38, 0.4); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.2); }
            100% { border-color: rgba(220, 38, 38, 1); box-shadow: 0 0 15px 2px rgba(220, 38, 38, 0.3); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased pb-12">

    <!-- Navbar Header -->
    <nav class="glass-nav sticky top-0 z-40 px-4 py-3 mb-6">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-red-500/20">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-gray-900 flex items-center gap-2">
                        จอแสดงรายการห้องครัว <span class="text-xs font-semibold px-2.5 py-0.5 bg-red-100 text-red-600 rounded-full">KDS System</span>
                    </h1>
                    <p class="text-xs text-gray-500">ร้านข้าวขาหมูจักรพรรดิ (เฉพาะรายการที่ชำระเงินแล้ว)</p>
                </div>
            </div>

            <!-- Action Controls & Status -->
            <div class="flex items-center gap-3">
                <!-- Sound Toggle -->
                <button id="soundToggleBtn" onclick="toggleSound()" class="px-3 py-2 bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 text-xs font-semibold rounded-xl transition flex items-center gap-2 shadow-sm">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-red-600"></i>
                    <span id="soundText">เปิดเสียงเตือน</span>
                </button>

                <!-- Audio Test Button -->
                <button onclick="playAlertSound()" class="px-3 py-2 bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 text-xs font-semibold rounded-xl transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-bell"></i> ทดสอบเสียง
                </button>

                <!-- Clock -->
                <div class="text-right hidden sm:block border-l border-gray-200 pl-4 ml-1">
                    <div id="kitchenClock" class="text-sm font-bold text-gray-800 whitespace-nowrap">00:00:00</div>
                    <div id="kitchenDate" class="text-xs text-gray-500 whitespace-nowrap">16 ต.ค. 2026</div>
                </div>
            </div>

        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4">
        
        <!-- Filter Tabs & Stats Header -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            
            <!-- Filter Tabs -->
            <div class="flex items-center gap-2 bg-gray-200/80 p-1 rounded-2xl text-xs font-medium backdrop-blur-md">
                <button onclick="setFilter('all')" id="filter-all" class="filter-tab px-4 py-2 rounded-xl transition font-semibold bg-white text-red-600 shadow-sm">
                    ทั้งหมด (<span id="count-all">0</span>)
                </button>
                <button onclick="setFilter('pending')" id="filter-pending" class="filter-tab px-4 py-2 rounded-xl transition font-semibold text-gray-600 hover:text-gray-900">
                    🔴 รอดำเนินการ (<span id="count-pending">0</span>)
                </button>
                <button onclick="setFilter('cooking')" id="filter-cooking" class="filter-tab px-4 py-2 rounded-xl transition font-semibold text-gray-600 hover:text-gray-900">
                    🟡 กำลังทำ (<span id="count-cooking">0</span>)
                </button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-tab px-4 py-2 rounded-xl transition font-semibold text-gray-600 hover:text-gray-900">
                    🟢 ทำเสร็จแล้ว (<span id="count-completed">0</span>)
                </button>
            </div>

            <!-- Clear Completed Orders Button -->
            <button onclick="clearCompletedOrders()" class="text-xs font-semibold text-gray-500 hover:text-red-600 transition flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-red-50 border border-transparent hover:border-red-200">
                <i class="fa-solid fa-broom"></i> ล้างรายการที่ทำเสร็จแล้ว
            </button>
        </div>

        <!-- Orders Grid Container -->
        <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 items-start">
            <!-- Order Cards Will Be Dynamically Rendered Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 bg-white/60 backdrop-blur-md rounded-3xl border border-dashed border-gray-300 max-w-xl mx-auto mt-8">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400 text-2xl">
                <i class="fa-solid fa-square-check"></i>
            </div>
            <h3 class="text-base font-bold text-gray-700 mb-1">ยังไม่มีคำสั่งซื้อที่ต้องทำ</h3>
            <p class="text-xs text-gray-500">เมื่อมีลูกค้าสั่งซื้อและชำระเงินสำเร็จ ออเดอร์จะแสดงขึ้นที่นี่อัตโนมัติ</p>
        </div>

    </main>

    <!-- JavaScript Execution Code -->
    <script>
        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        let orders = [];
        let currentFilter = 'all';
        let isSoundEnabled = true;

        // BroadcastChannel สำหรับรับออเดอร์จาก index.html
        const kitchenChannel = new BroadcastChannel('khamoo_order_channel');

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            loadOrdersFromStorage();
            startClock();
            renderOrders();

            // ฟัง BroadcastChannel เพื่อรับออเดอร์ใหม่ Real-time
            kitchenChannel.onmessage = (event) => {
                if (event.data) {
                    addNewOrder(event.data);
                }
            };

            // ฟัง LocalStorage Event (รองรับกรณีข้ามแท็บ/รีเฟรช)
            window.addEventListener('storage', (e) => {
                if (e.key === 'khamoo_new_order_trigger' || e.key === 'khamoo_pending_orders') {
                    loadOrdersFromStorage();
                    renderOrders();
                }
            });
        });

        // ==========================================
        // DATA LOAD & STORAGE
        // ==========================================
        function loadOrdersFromStorage() {
            const saved = localStorage.getItem('khamoo_pending_orders');
            if (saved) {
                try {
                    orders = JSON.parse(saved);
                } catch (e) {
                    console.error('Error parsing orders:', e);
                    orders = [];
                }
            }
        }

        function saveOrdersToStorage() {
            localStorage.setItem('khamoo_pending_orders', JSON.stringify(orders));
        }

        function addNewOrder(newOrder) {
            // ป้องกันการเพิ่มออเดอร์ซ้ำ
            if (!orders.some(o => o.id === newOrder.id)) {
                orders.unshift(newOrder); // ให้ออเดอร์ใหม่อยู่บนสุด
                saveOrdersToStorage();
                renderOrders();

                if (isSoundEnabled) {
                    playAlertSound();
                }
            }
        }

        // ==========================================
        // AUDIO ALERT SYSTEM (Web Audio API)
        // ==========================================
        function playAlertSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // Beep 1
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, ctx.currentTime); // A5
                gain1.gain.setValueAtTime(0.3, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.25);

                // Beep 2
                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1174.66, ctx.currentTime); // D6
                    gain2.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.4);
                }, 150);

            } catch (e) {
                console.log('Audio Context Error:', e);
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const text = document.getElementById('soundText');
            const icon = document.getElementById('soundIcon');
            
            if (isSoundEnabled) {
                text.innerText = 'เปิดเสียงเตือน';
                icon.className = 'fa-solid fa-volume-high text-red-600';
            } else {
                text.innerText = 'ปิดเสียงเตือน';
                icon.className = 'fa-solid fa-volume-xmark text-gray-400';
            }
        }

        // ==========================================
        // RENDER KITCHEN CARDS
        // ==========================================
        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            // กรองรายการตาม Filter
            const filteredOrders = orders.filter(o => {
                if (currentFilter === 'all') return true;
                return o.status === currentFilter;
            });

            // อัปเดตตัวเลข Stats บน Tabs
            updateCounts();

            if (filteredOrders.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredOrders.forEach(order => {
                const card = document.createElement('div');
                
                // กำหนดสไตล์การ์ดตามสถานะ
                let statusBadge = '';
                let statusBorder = '';
                let actionButton = '';

                if (order.status === 'pending') {
                    statusBadge = `<span class="px-2.5 py-1 bg-red-100 text-red-700 font-bold rounded-lg text-xs flex items-center gap-1"><i class="fa-solid fa-circle text-[8px] animate-ping"></i> รอดำเนินการ</span>`;
                    statusBorder = 'border-2 border-red-500 order-card-new bg-white';
                    actionButton = `
                        <button onclick="updateOrderStatus('${order.id}', 'cooking')" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-fire"></i> เริ่มทำอาหาร
                        </button>
                    `;
                } else if (order.status === 'cooking') {
                    statusBadge = `<span class="px-2.5 py-1 bg-amber-100 text-amber-800 font-bold rounded-lg text-xs flex items-center gap-1"><i class="fa-solid fa-spinner fa-spin text-xs"></i> กำลังปรุง</span>`;
                    statusBorder = 'border-2 border-amber-400 bg-amber-50/30';
                    actionButton = `
                        <button onclick="updateOrderStatus('${order.id}', 'completed')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> ทำเสร็จแล้ว
                        </button>
                    `;
                } else {
                    statusBadge = `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-lg text-xs flex items-center gap-1"><i class="fa-solid fa-circle-check text-xs"></i> เสร็จสิ้น</span>`;
                    statusBorder = 'border border-gray-200 bg-gray-50/80 opacity-75';
                    actionButton = `
                        <button onclick="updateOrderStatus('${order.id}', 'cooking')" class="w-full py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-xl text-xs transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-rotate-left"></i> ย้อนกลับไปทำใหม่
                        </button>
                    `;
                }

                // สร้างรายการอาหาร
                let itemsHTML = '';
                if (order.items && order.items.length > 0) {
                    itemsHTML = order.items.map(item => `
                        <div class="py-2 border-b border-gray-100 last:border-none">
                            <div class="flex items-start justify-between gap-2">
                                <span class="font-bold text-gray-900 text-sm leading-snug">
                                    ${item.name}
                                </span>
                                <span class="font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-lg text-xs whitespace-nowrap">
                                    x${item.quantity}
                                </span>
                            </div>
                            
                            <!-- Options & Note -->
                            ${item.options && item.options.length > 0 ? `
                                <div class="text-xs text-gray-600 font-medium mt-1 pl-2 border-l-2 border-red-300">
                                    ${item.options.join(', ')}
                                </div>
                            ` : ''}

                            ${item.note ? `
                                <div class="text-xs text-red-600 font-semibold mt-1 bg-red-50 p-1.5 rounded-lg border border-red-100">
                                    <i class="fa-regular fa-comment-dots mr-1"></i> ${item.note}
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }

                card.className = `glass-card rounded-2xl p-4 transition-all duration-200 ${statusBorder}`;
                card.innerHTML = `
                    <!-- Card Header -->
                    <div class="flex items-center justify-between gap-2 mb-3 pb-3 border-b border-gray-200/80">
                        <div>
                            <div class="text-base font-black text-gray-900">
                                โต๊ะ: <span class="text-red-600">${order.table || 'หน้าร้าน'}</span>
                                <span class="text-xs font-normal text-gray-500 font-mono ml-1">(${order.type || 'ทานที่ร้าน'})</span>
                            </div>
                            <div class="text-[11px] text-gray-400 font-mono">
                                #${order.id} • ${order.time || ''}
                            </div>
                        </div>
                        <div>
                            ${statusBadge}
                        </div>
                    </div>

                    <!-- Food Items List -->
                    <div class="space-y-1 mb-4 max-h-60 overflow-y-auto pr-1">
                        ${itemsHTML}
                    </div>

                    <!-- Footer Action -->
                    <div class="pt-2 border-t border-gray-200/60">
                        ${actionButton}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ==========================================
        // UPDATE ORDER STATUS
        // ==========================================
        function updateOrderStatus(orderId, newStatus) {
            const index = orders.findIndex(o => o.id === orderId);
            if (index !== -1) {
                orders[index].status = newStatus;
                saveOrdersToStorage();
                renderOrders();
            }
        }

        function clearCompletedOrders() {
            if (confirm('คุณต้องการล้างรายการออเดอร์ที่ทำเสร็จแล้วออกจากจอภาพใช่หรือไม่?')) {
                orders = orders.filter(o => o.status !== 'completed');
                saveOrdersToStorage();
                renderOrders();
            }
        }

        // ==========================================
        // FILTER TABS & UI HELPERS
        // ==========================================
        function setFilter(filterType) {
            currentFilter = filterType;
            
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.className = 'filter-tab px-4 py-2 rounded-xl transition font-semibold text-gray-600 hover:text-gray-900';
            });

            const activeBtn = document.getElementById(`filter-${filterType}`);
            if (activeBtn) {
                activeBtn.className = 'filter-tab px-4 py-2 rounded-xl transition font-semibold bg-white text-red-600 shadow-sm';
            }

            renderOrders();
        }

        function updateCounts() {
            document.getElementById('count-all').innerText = orders.length;
            document.getElementById('count-pending').innerText = orders.filter(o => o.status === 'pending').length;
            document.getElementById('count-cooking').innerText = orders.filter(o => o.status === 'cooking').length;
            document.getElementById('count-completed').innerText = orders.filter(o => o.status === 'completed').length;
        }

        // ==========================================
        // LIVE CLOCK
        // ==========================================
        function startClock() {
            const updateTime = () => {
                const now = new Date();
                document.getElementById('kitchenClock').innerText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('kitchenDate').innerText = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            };
            updateTime();
            setInterval(updateTime, 1000);
        }
    </script>
</body>
</html>
